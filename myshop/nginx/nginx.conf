upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Статичні файли Django (admin CSS/JS, зібрані collectstatic у web-контейнері).
    location /static/ {
        alias /app/staticfiles/;
    }

    # Завантажені користувачами файли (зображення товарів тощо).
    location /media/ {
        alias /app/media/;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA: усе інше віддаємо index.html, роутинг — на клієнті
    # (react-router-dom). Без цього оновлення сторінки на /products/5
    # давало б 404 від nginx замість передачі маршруту фронтенду.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
