[project]
name = "myshop"
version = "0.1.0"
description = "E-commerce store backend (Django + DRF) with a React frontend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-filter>=24.2,<25.0",
    "drf-spectacular>=0.27,<0.28",
    "django-cors-headers>=4.4,<4.5",
    "psycopg[binary]>=3.2,<3.3",
    "python-dotenv>=1.0,<1.1",
    "Pillow>=10.4,<11.0",
    "gunicorn>=22.0,<23.0",
    "whitenoise>=6.7,<6.8",
]

# Не є пакетом, який потрібно збирати/публікувати — лише застосунок.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-django>=4.8,<5.0",
    "factory-boy>=3.3,<3.4",
    "flake8>=7.1,<7.2",
    "mypy>=1.11,<1.12",
    "django-stubs[compatible-mypy]>=5.0,<5.1",
    "djangorestframework-stubs>=3.15,<3.16",
    "ruff>=0.16.8",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra"

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/"]

# Тести навмисно виключені зі строгої перевірки: factory-boy не має
# офіційних тайп-стабів (виклик ProductFactory() у рантаймі повертає
# екземпляр Product, але статично mypy бачить лише клас фабрики), а
# force_authenticate(user) у тестах DRF навмисно приймає "розхлябаний"
# рантайм-об'єкт. Типізувати це строго — витрати часу без реальної
# користі; сам код застосунку (не тести) перевіряється повністю.
[[tool.mypy.overrides]]
module = ["*.tests.*", "*.tests"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"


[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/*",
    "*/apps.py",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
# Максимальная длина строки (как для Django/Black)
line-length = 119

# Папки, которые Ruff должен полностью игнорировать
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
# Включаем базовые правила (E, F) + правила isort (I) + специфичные для Django (DJ)
select = ["E", "F", "I", "DJ"]

# Игнорируем специфичные ошибки во всем проекте (например, E501 для длинных строк)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Игнорируем неиспользуемые импорты и импорты со звездочкой в файлах настроек Django
"**/settings.py" = ["F401", "F403"]
# Игнорируем длинные строки в автоматически сгенерированных миграциях
"**/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
# Автоматически группировать импорты Django в отдельный блок после стандартных библиотек Python
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
